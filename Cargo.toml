[workspace]
resolver = "2"
members = [
  "crates/cakesplitter-format",
  "crates/cakesplitter-integrity",
  "crates/cakesplitter-core",
  "crates/cakesplitter-cli",
  "crates/cakesplitter-desktop-runtime",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cakesplitter-format = { path = "crates/cakesplitter-format" }
cakesplitter-integrity = { path = "crates/cakesplitter-integrity" }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.41", features = ["derive"] }
ctrlc = "3.4.7"
hex = "0.4.3"
libc = "0.2.174"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
fs4 = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
regex = "1.11.1"
